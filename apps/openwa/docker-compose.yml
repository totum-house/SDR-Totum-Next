# =========================================================
# SDR-Next — OpenWA (gateway WhatsApp)
# =========================================================
# Bind: 127.0.0.1:3000 — NUNCA 0.0.0.0
# Traefik expõe zap.grupototum.com (config em Coolify, não aqui)
# =========================================================

services:
  openwa:
    image: openwa/wa-automate:latest
    container_name: sdr-openwa
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - PORT=3000
      - MCP_READONLY=false
      - WEBHOOK_URL=http://host.docker.internal:3100/api/webhook/openwa
      - WEBHOOK_TOKEN=${OPENWA_WEBHOOK_TOKEN}
      - SESSION_ID=sdr-totum-prod
    volumes:
      - ./sessions:/sessions
      - ./config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
